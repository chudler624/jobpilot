<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobpilot</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--font-sans);font-size:15px}
  button{font-family:inherit}
  a{color:var(--cobalt);text-decoration:none}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:224px;flex:0 0 auto;background:var(--paper);border-right:1px solid var(--hairline);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:20px 20px 16px}
  .brand img{height:24px;width:auto;display:block}
  .nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
  .navitem{display:block;padding:8px 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--slate);cursor:pointer;transition:background var(--duration) var(--ease-standard),color var(--duration) var(--ease-standard)}
  .navitem:hover{background:var(--paper-hover);color:var(--graphite)}
  .navitem.active{background:var(--graphite);color:var(--paper)}
  .side-foot{margin-top:auto;border-top:1px solid var(--hairline);padding:16px}
  .side-foot .email{font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* main */
  .main{flex:1;min-width:0;padding:40px 48px;max-width:1000px}
  h1.page{font-size:26px;font-weight:500;margin:0}
  .sub{color:var(--slate);font-size:15px;margin:4px 0 0}
  /* generic */
  .panel{background:var(--white);border:1px solid var(--hairline);border-radius:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;line-height:1;white-space:nowrap}
  .pill.solid{background:var(--cobalt);color:#fff}
  .pill.outline{background:var(--white);border:1px solid var(--hairline);color:var(--graphite)}
  .pill.muted{background:var(--paper);border:1px solid var(--hairline);color:var(--slate)}
  .pill.ink{background:var(--graphite);color:var(--paper)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-size:14px;font-weight:500;cursor:pointer;transition:background var(--duration) var(--ease-standard),border-color var(--duration) var(--ease-standard)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--cobalt);color:#fff}
  .btn.primary:hover{background:var(--cobalt-press)}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--paper);border-color:var(--hairline);color:var(--graphite)}
  .btn.secondary:hover{background:var(--paper-hover)}
  .btn.ghost{background:transparent;color:var(--graphite)}
  .btn.ghost:hover{background:var(--paper-hover)}
  .disclose{background:none;border:none;padding:0;color:var(--cobalt);font-size:14px;font-weight:500;cursor:pointer}
  .marker-f{width:9px;height:9px;border-radius:50%;background:var(--graphite);flex:0 0 auto}
  .marker-h{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--graphite);flex:0 0 auto}
  .hr{height:1px;background:var(--hairline);border:none;margin:0}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
